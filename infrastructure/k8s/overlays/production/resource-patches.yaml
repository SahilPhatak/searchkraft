# Production resource patches — higher limits for 100K concurrent users
---
# API Gateway — highest traffic, generous resources
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: searchkraft
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api-gateway
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
---
# Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: searchkraft
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: auth-service
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
---
# Jobs Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-service
  namespace: searchkraft
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: jobs-service
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1Gi
---
# Candidate Service — highest traffic after gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-service
  namespace: searchkraft
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: candidate-service
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
---
# Notification Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: searchkraft
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: notification-service
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
# AI Service — CPU-intensive
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: searchkraft
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: ai-service
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
---
# Analytics Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: searchkraft
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: analytics-service
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
# Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: searchkraft
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Production HPA overrides
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: searchkraft
spec:
  minReplicas: 3
  maxReplicas: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: candidate-service-hpa
  namespace: searchkraft
spec:
  minReplicas: 3
  maxReplicas: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jobs-service-hpa
  namespace: searchkraft
spec:
  minReplicas: 2
  maxReplicas: 15

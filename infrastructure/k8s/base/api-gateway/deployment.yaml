apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: searchkraft
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: searchkraft
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: searchkraft
    spec:
      serviceAccountName: searchkraft-sa
      containers:
        - name: api-gateway
          image: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/searchkraft/api-gateway:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: searchkraft-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: searchkraft-secrets
                  key: jwt-secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: searchkraft-secrets
                  key: redis-url
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: LOG_LEVEL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: AUTH_SERVICE_URL
            - name: JOBS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: JOBS_SERVICE_URL
            - name: CANDIDATE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: CANDIDATE_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: NOTIFICATION_SERVICE_URL
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: AI_SERVICE_URL
            - name: ANALYTICS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: ANALYTICS_SERVICE_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: searchkraft-config
                  key: CORS_ORIGIN
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api-gateway

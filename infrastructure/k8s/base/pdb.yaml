# Pod Disruption Budgets — ensure availability during node drains/upgrades
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: searchkraft
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: searchkraft
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jobs-service-pdb
  namespace: searchkraft
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: jobs-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: candidate-service-pdb
  namespace: searchkraft
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: candidate-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: searchkraft
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend

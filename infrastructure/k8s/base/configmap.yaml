apiVersion: v1
kind: ConfigMap
metadata:
  name: searchkraft-config
  namespace: searchkraft
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  # Internal service URLs (ClusterIP DNS names)
  AUTH_SERVICE_URL: "http://auth-service.searchkraft.svc.cluster.local:3001"
  JOBS_SERVICE_URL: "http://jobs-service.searchkraft.svc.cluster.local:3002"
  CANDIDATE_SERVICE_URL: "http://candidate-service.searchkraft.svc.cluster.local:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service.searchkraft.svc.cluster.local:3004"
  AI_SERVICE_URL: "http://ai-service.searchkraft.svc.cluster.local:3005"
  ANALYTICS_SERVICE_URL: "http://analytics-service.searchkraft.svc.cluster.local:3006"
  # CORS
  CORS_ORIGIN: "https://searchkraft.com,https://www.searchkraft.com,https://app.searchkraft.com"
  # Rate limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "200"

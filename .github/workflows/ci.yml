name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: apps/web
        run: npm install
      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          VITE_API_URL: ''
          VITE_BASE_URL: /searchkraft/

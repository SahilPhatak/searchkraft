name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Show versions
        working-directory: apps/web
        run: |
          node --version
          npm --version
          cat package.json
          ls node_modules/.bin/vite || echo "vite not found"

      - name: Build web app
        id: build
        working-directory: apps/web
        continue-on-error: true
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run build 2>&1 | tee /tmp/vite-build.log; exit ${PIPESTATUS[0]}

      - name: Print build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== VITE BUILD LOG ==="
          cat /tmp/vite-build.log
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

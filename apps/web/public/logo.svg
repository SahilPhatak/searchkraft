<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Paper plane icon -->
  <g transform="translate(0, 4)">
    <polygon points="0,20 38,0 28,20 38,40" fill="url(#planeGrad)" opacity="0.3"/>
    <polygon points="0,20 38,0 18,24" fill="url(#planeGrad)"/>
    <polygon points="18,24 28,20 22,36" fill="#7C3AED"/>
  </g>
  <!-- Search text (white/light) -->
  <text x="48" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="white" letter-spacing="-0.5">Search</text>
  <!-- Kraft text (purple gradient) -->
  <text x="148" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="url(#kraftGrad)" letter-spacing="-0.5">Kraft</text>
</svg>
